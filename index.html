<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achiever HQ — Merchant TNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1A3049; --navy-soft:#24405E; --terracotta:#C4663F; --terracotta-dim:#A9542F;
    --grey:#6F7378; --grey-light:#9AA0A6; --border:#E3E5E8; --border-soft:#EDEEF0;
    --bg:#F6F5F3; --card:#FFFFFF; --hover:#FBFAF8;
    --ok:#2E7D5B;   --ok-bg:#E9F4EE;   --ok-br:#C6E0D3;
    --prog:#9A6B06; --prog-bg:#FBF2DC; --prog-br:#EEDFB4;
    --bad:#A93D28;  --bad-bg:#FBECE8;  --bad-br:#EFCCC3;
    --na:#A3A8AD;   --na-bg:#F1F2F3;   --na-br:#E3E5E8;
    --pend-bg:#EDEFF1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--bg);
    color:var(--navy);-webkit-font-smoothing:antialiased;font-size:14px}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  .hidden{display:none !important}

  /* ---------------------------------------------------------------- login */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px;background:linear-gradient(170deg,var(--navy) 0%,#132438 100%)}
  .login-card{width:100%;max-width:392px;background:var(--card);border-radius:16px;
    padding:34px 28px 28px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
  .brand{font-family:'Fraunces',serif;font-size:13px;font-weight:600;letter-spacing:3px;
    text-transform:uppercase;color:var(--terracotta);margin-bottom:22px}
  .login-card h1{font-family:'Fraunces',serif;font-size:27px;font-weight:500;margin:0 0 6px;line-height:1.2}
  .login-card h1 em{font-style:italic;color:var(--terracotta)}
  .login-card p.sub{font-size:13.5px;color:var(--grey);margin:0 0 24px;line-height:1.5}

  .field{margin-bottom:15px}
  .field label{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.3px;
    text-transform:uppercase;color:var(--grey);margin-bottom:6px}
  .field input,.field textarea{width:100%;appearance:none;-webkit-appearance:none;
    font-size:16px;font-weight:500;background:#fff;border:1px solid var(--border);
    border-radius:10px;padding:12px 13px}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--terracotta)}
  #pin{letter-spacing:9px;text-align:center;font-weight:700}
  #pin::placeholder{letter-spacing:3px;color:var(--grey-light);font-weight:500}
  .hint{font-size:11.5px;color:var(--grey-light);margin-top:6px;line-height:1.45}

  .btn{appearance:none;border:1px solid transparent;border-radius:9px;padding:10px 15px;
    font-weight:700;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap}
  .btn-primary{background:var(--terracotta);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--terracotta-dim)}
  .btn-primary:disabled{opacity:.45;cursor:default}
  .btn-ghost{background:#fff;color:var(--grey);border-color:var(--border)}
  .btn-ghost:hover{color:var(--navy);border-color:var(--grey-light)}
  .btn-full{width:100%;padding:14px}

  .msg{font-size:13px;font-weight:600;border-radius:9px;padding:11px 13px;margin-bottom:14px;line-height:1.45}
  .msg-err{background:var(--bad-bg);color:var(--bad)}

  /* ------------------------------------------------------------------ app */
  #app{min-height:100dvh;display:flex;flex-direction:column}
  .topbar{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;
    gap:14px;position:sticky;top:0;z-index:30}
  .topbar .mark{font-family:'Fraunces',serif;font-size:15px;font-weight:600;letter-spacing:1.4px;
    text-transform:uppercase;white-space:nowrap}
  .topbar .mark span{color:var(--terracotta)}
  .topbar .tag{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
    color:rgba(255,255,255,.5)}
  .topbar .who{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);
    padding:6px 12px;border-radius:999px;white-space:nowrap}
  .topbar .out{background:none;border:none;color:rgba(255,255,255,.72);font-size:12px;
    font-weight:700;cursor:pointer;padding:6px 2px}
  .topbar .out:hover{color:#fff}

  .wrap{width:100%;max-width:1680px;margin:0 auto;padding:16px 20px 80px}

  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 14px;
    display:flex;align-items:baseline;gap:8px;cursor:pointer;transition:border-color .12s,background .12s}
  .stat:hover{border-color:var(--grey-light)}
  .stat.on{border-color:var(--navy);background:var(--navy);color:#fff}
  .stat.on .l{color:rgba(255,255,255,.75)}
  .stat .n{font-family:'Fraunces',serif;font-size:20px;font-weight:600;line-height:1}
  .stat .l{font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--grey)}
  .stat.ok:not(.on) .n{color:var(--ok)}
  .stat.bad:not(.on) .n{color:var(--bad)}

  .pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:thin}
  .pills::-webkit-scrollbar{height:5px}
  .pills::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .pill{flex:none;display:inline-flex;align-items:center;gap:7px;cursor:pointer;border-radius:999px;
    padding:6px 13px 6px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;
    background:hsl(var(--h) 60% 95%);color:hsl(var(--h) 55% 27%);border:1px solid hsl(var(--h) 42% 87%)}
  .pill .sw{width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 52% 46%);flex:none}
  .pill .ct{font-size:11px;font-weight:800;opacity:.65}
  .pill.on{background:hsl(var(--h) 52% 32%);color:#fff;border-color:hsl(var(--h) 52% 32%)}
  .pill.on .sw{background:rgba(255,255,255,.85)}
  .pill.all{background:#fff;color:var(--grey);border-color:var(--border)}
  .pill.all .sw{display:none}
  .pill.all.on{background:var(--navy);color:#fff;border-color:var(--navy)}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .toolbar input[type=search],.toolbar select{appearance:none;-webkit-appearance:none;background:#fff;
    border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13.5px;font-weight:500}
  .toolbar input[type=search]{flex:1 1 230px;min-width:0}
  .toolbar select{padding-right:34px;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236F7378' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat:no-repeat;background-position:right 11px center;background-size:16px}
  .toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--terracotta)}
  .toolbar .spacer{flex:1 1 auto}
  .count{font-size:12.5px;font-weight:700;color:var(--grey);white-space:nowrap;padding:0 2px}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .seg button{border:none;background:none;padding:9px 15px;font-size:13px;font-weight:700;
    color:var(--grey);cursor:pointer}
  .seg button.on{background:var(--navy);color:#fff}

  /* ================================================================= CARD */
  .card{background:var(--card);border:1px solid var(--border);border-radius:13px;
    margin-bottom:12px;overflow:hidden;border-left:4px solid hsl(var(--h,210) 50% 58%)}
  .card.closed{opacity:.62}
  .card.dirty{border-color:var(--terracotta)}

  .ctop{display:grid;grid-template-columns:238px minmax(0,1fr);align-items:stretch}

  /* ---- left: identity ---- */
  .cleft{padding:14px 15px;border-right:1px solid var(--border-soft);display:flex;
    flex-direction:column;gap:3px;min-width:0}
  .cleft .po{font-family:'Fraunces',serif;font-size:21px;font-weight:600;line-height:1.1}
  .cleft .sn{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
    color:var(--grey-light)}
  .cleft .nm{font-size:13.5px;font-weight:700;line-height:1.35;margin-top:3px;word-break:break-word}
  .cleft .buyer{align-self:flex-start;margin-top:7px;font-size:11.5px;font-weight:800;padding:4px 11px;
    border-radius:999px;background:hsl(var(--h) 60% 94%);color:hsl(var(--h) 55% 27%);
    border:1px solid hsl(var(--h) 42% 86%);max-width:100%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;cursor:pointer}
  .cleft .meta{margin-top:auto;padding-top:9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .mini{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--pend-bg);
    color:var(--grey);white-space:nowrap}
  .mini.ok{background:var(--ok-bg);color:var(--ok)}
  .mini.bad{background:var(--bad-bg);color:var(--bad)}
  .mini.prog{background:var(--prog-bg);color:var(--prog)}
  .lg{background:none;border:none;padding:0;font-size:11px;font-weight:800;color:var(--grey-light);
    cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .lg:hover{color:var(--navy)}

  /* ---- right: milestone strip ---- */
  .cms{position:relative;min-width:0}
  .strip{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scroll-behavior:smooth}
  .strip::-webkit-scrollbar{height:7px}
  .strip::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .strip::-webkit-scrollbar-track{background:transparent}

  .mt{flex:none;width:146px;border:1px solid var(--border);border-radius:10px;padding:9px;
    background:#FDFDFC;display:flex;flex-direction:column;gap:6px}
  .mt.late{border-color:var(--bad-br);background:#FFFCFB}
  .mt .mh{display:flex;align-items:baseline;gap:5px;min-width:0}
  .mt .mn{font-size:10px;font-weight:800;color:var(--grey-light);flex:none}
  .mt .ml{font-size:11.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .mt.late .ml{color:var(--bad)}

  .st{width:100%;border-radius:7px;padding:7px 6px;font-size:11.5px;font-weight:800;cursor:pointer;
    border:1px solid var(--border);background:var(--pend-bg);color:var(--grey);text-align:center}
  .st:hover{filter:brightness(.97)}
  .st.s-approved{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-br)}
  .st.s-progress{background:var(--prog-bg);color:var(--prog);border-color:var(--prog-br)}
  .st.s-rejected{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-br)}
  .st.s-na{background:var(--na-bg);color:var(--na);border-color:var(--na-br)}

  .mf{display:flex;align-items:center;gap:5px}
  .mf b{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    color:var(--grey-light);width:26px;flex:none}
  .mf input{flex:1;min-width:0;border:1px solid var(--border);border-radius:6px;padding:4px 5px;
    font-size:11px;font-weight:600;background:#fff}
  .mf input:focus{outline:none;border-color:var(--terracotta)}
  .mf span.none{flex:1;font-size:11px;color:var(--grey-light);font-style:italic;padding:4px 0}

  /* Fades that say "there is more over here" without stealing a scrollbar. */
  .cms::before,.cms::after{content:"";position:absolute;top:0;bottom:7px;width:22px;
    pointer-events:none;z-index:2;opacity:0;transition:opacity .15s}
  .cms::before{left:0;background:linear-gradient(90deg,#fff,rgba(255,255,255,0))}
  .cms::after{right:0;background:linear-gradient(270deg,#fff,rgba(255,255,255,0))}
  .cms.more-l::before{opacity:1}
  .cms.more-r::after{opacity:1}

  /* ---- bottom: the two boxes ---- */
  .cbot{border-top:1px solid var(--border-soft);background:#FBFAF8;padding:11px 14px;
    display:grid;grid-template-columns:1fr 1.3fr auto;gap:10px;align-items:end}
  .cbot .f{min-width:0}
  .cbot label{display:block;font-size:9.5px;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;color:var(--grey);margin-bottom:4px}
  .cbot input,.cbot textarea{width:100%;border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-size:13px;font-weight:500;background:#fff;resize:vertical}
  .cbot textarea{min-height:36px;max-height:120px;line-height:1.4}
  .cbot input:focus,.cbot textarea:focus{outline:none;border-color:var(--terracotta)}
  .cbot .go{display:flex;gap:7px;align-items:center}
  .unsaved{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    color:var(--terracotta);white-space:nowrap;opacity:0;transition:opacity .15s}
  .card.dirty .unsaved{opacity:1}

  .logbox{border-top:1px solid var(--border-soft);background:#FBFAF8;padding:11px 14px;
    max-height:220px;overflow-y:auto;font-size:11.5px;line-height:1.65;color:var(--navy-soft);
    white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  @media(max-width:900px){
    .wrap{padding:14px 12px 80px}
    .ctop{grid-template-columns:1fr}
    .cleft{border-right:none;border-bottom:1px solid var(--border-soft)}
    .cleft .meta{margin-top:9px}
    .cbot{grid-template-columns:1fr;gap:9px}
    .cbot .go{justify-content:space-between}
  }

  .empty{text-align:center;padding:64px 20px;color:var(--grey)}
  .empty h3{font-family:'Fraunces',serif;font-size:19px;font-weight:500;margin:0 0 8px;color:var(--navy)}
  .loading{text-align:center;padding:64px 20px;color:var(--grey);font-size:13.5px;font-weight:600}

  /* ------------------------------------------------------------- popover */
  #pop{position:absolute;z-index:60;background:#fff;border:1px solid var(--border);
    border-radius:10px;box-shadow:0 10px 30px rgba(26,48,73,.18);padding:5px;display:none;min-width:136px}
  #pop.open{display:block}
  #pop button{display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
    padding:8px 10px;border-radius:7px;font-size:12.5px;font-weight:700}
  #pop button:hover{background:var(--hover)}
  #pop button .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
  #pop button[data-v="Approved"] .d{background:var(--ok)}
  #pop button[data-v="In Progress"] .d{background:var(--prog)}
  #pop button[data-v="Rejected"] .d{background:var(--bad)}
  #pop button[data-v="N/A"] .d{background:var(--na)}
  #pop button[data-v="Pending"] .d{background:#C3C7CB}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);
    background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:12px 20px;border-radius:999px;
    z-index:70;transition:transform .22s ease;max-width:calc(100% - 36px);text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.bad{background:var(--bad)}
</style>
</head>
<body>

<!-- ============================== LOGIN ============================== -->
<div id="login">
  <div class="login-card">
    <div class="brand">Achiever HQ</div>
    <h1>Merchant <em>TNA</em></h1>
    <p class="sub">Sign in with your work email and PIN.</p>

    <div class="msg msg-err hidden" id="login-err"></div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" inputmode="email" autocomplete="username"
             placeholder="name@achieverapparels.in">
    </div>

    <div class="field">
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*"
             maxlength="6" placeholder="••••" autocomplete="current-password">
      <div class="hint">Access is managed on the Merchant_Mapping tab of the tracker.</div>
    </div>

    <button class="btn btn-primary btn-full" id="signin" disabled>Sign in</button>
  </div>
</div>

<!-- =============================== APP =============================== -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="mark">Achiever<span>HQ</span></div>
    <div class="tag">Merchant TNA</div>
    <div class="who" id="badge">—</div>
    <button class="out" id="signout">Sign out</button>
  </div>

  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="pills" id="buyers"></div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Search PO, style, buyer, task…  (press /)" autocomplete="off">
      <div class="seg" id="seg">
        <button data-oc="" class="on">All</button>
        <button data-oc="Open">Open</button>
        <button data-oc="Closed">Closed</button>
      </div>
      <select id="f-stage"><option value="">Any milestone</option></select>
      <div class="spacer"></div>
      <span class="count" id="count"></span>
      <button class="btn btn-ghost" id="reset">Clear</button>
      <button class="btn btn-ghost" id="refresh">Refresh</button>
    </div>

    <div id="content"><div class="loading">Loading your styles…</div></div>
  </div>
</div>

<div id="pop"></div>
<div class="toast" id="toast"></div>

<script>
/* ===========================================================================
   CONFIGURATION — the /exec URL of the "Achiever HQ - TNA API" deployment.

   No PINs live in this file. They stay in the Merchant_Mapping tab and are
   checked server-side, so viewing this page's source reveals nothing.
   =========================================================================== */
var API_URL = "https://script.google.com/macros/s/AKfycbzpvxvkwiOZ_kMouGd8TE0x183uHFSaLj67yUHIpBSQK6dIrFOBBjZpQxXbKqu_xHAS/exec";

/* --------------------------------------------------------------- transport */
// text/plain on purpose: Apps Script does not answer CORS preflight requests,
// and text/plain is sent without one. It also keeps the PIN out of the URL.
async function api(payload) {
  var res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
    redirect: "follow"
  });
  if (!res.ok) throw new Error("The server returned " + res.status + ".");
  var text = await res.text();
  try { return JSON.parse(text); }
  catch (e) { throw new Error("Unexpected response from the server."); }
}

/* ------------------------------------------------------------------- state */
var state = {
  token: sessionStorage.getItem("tna_token") || "",
  name: sessionStorage.getItem("tna_name") || "",
  styles: [], rows: [],
  milestones: [], statuses: [],
  buyer: "", oc: "", quick: "",
  edits: {}   // poNo -> pending changes, kept until that card is submitted
};

var $ = function (id) { return document.getElementById(id); };
var esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
};

function toast(m, bad) {
  var t = $("toast");
  t.textContent = m;
  t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.className = "toast"; }, 3600);
}

/* ------------------------------------------------------------------- dates */
function todayIso() {
  var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function nice(isoStr) {
  var m = String(isoStr || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? Number(m[3]) + " " + MON[Number(m[2]) - 1] : "";
}
function daysFromToday(isoStr) {
  if (!isoStr) return null;
  return Math.round((new Date(isoStr + "T00:00:00") - new Date(todayIso() + "T00:00:00")) / 86400000);
}

/* ------------------------------------------------------------ buyer colour */
// Derived from the name so a buyer keeps the same colour for everyone, in every
// session — adding a buyer must not re-colour the rest.
var hueCache = {};
function hueOf(name) {
  var k = String(name || "").trim().toLowerCase();
  if (!k) return 210;
  if (hueCache[k] != null) return hueCache[k];
  var h = 0;
  for (var i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
  hueCache[k] = Math.round((h % 360) * 137.508) % 360;
  return hueCache[k];
}

/* ------------------------------------------------------------------- login */
function refreshSignin() {
  $("signin").disabled = !($("email").value.trim() && $("pin").value.length >= 4);
  $("login-err").className = "msg msg-err hidden";
}
$("email").addEventListener("input", refreshSignin);
$("pin").addEventListener("input", function () {
  this.value = this.value.replace(/\D/g, "").slice(0, 6);
  refreshSignin();
});
$("pin").addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !$("signin").disabled) $("signin").click();
});

$("signin").addEventListener("click", async function () {
  var btn = this;
  btn.disabled = true;
  btn.textContent = "Checking…";
  try {
    var r = await api({ action: "login", email: $("email").value.trim(), pin: $("pin").value });
    if (!r.ok) {
      $("login-err").className = "msg msg-err";
      $("login-err").textContent = r.error || "Could not sign you in.";
      $("pin").value = "";
      return;
    }
    state.token = r.token;
    state.name = r.name;
    sessionStorage.setItem("tna_token", r.token);
    sessionStorage.setItem("tna_name", r.name);
    enterApp();
  } catch (err) {
    $("login-err").className = "msg msg-err";
    $("login-err").textContent = err.message;
  } finally {
    btn.textContent = "Sign in";
    refreshSignin();
  }
});

$("signout").addEventListener("click", function () {
  sessionStorage.clear();
  location.reload();
});

/* --------------------------------------------------------------------- app */
function enterApp() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("badge").textContent = state.name;
  load();
}

async function load() {
  $("content").innerHTML = '<div class="loading">Loading your styles…</div>';
  try {
    var r = await api({ action: "list", token: state.token });
    if (!r.ok) {
      if (/sign in|expired|no longer/i.test(r.error || "")) return signedOut(r.error);
      $("content").innerHTML = '<div class="empty"><h3>Could not load</h3><p>' + esc(r.error) + "</p></div>";
      return;
    }
    state.styles = r.styles || [];
    state.milestones = r.milestones || [];
    state.statuses = r.statuses || [];
    state.edits = {};
    if (r.name) { state.name = r.name; $("badge").textContent = r.name; }

    $("f-stage").innerHTML = '<option value="">Any milestone</option>' +
      state.milestones.map(function (m) {
        return '<option value="' + esc(m.key) + '">Waiting: ' + esc(m.label) + "</option>";
      }).join("");

    render();
  } catch (err) {
    $("content").innerHTML = '<div class="empty"><h3>Could not load</h3><p>' + esc(err.message) + "</p></div>";
  }
}

function signedOut(m) {
  sessionStorage.clear();
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("login-err").className = "msg msg-err";
  $("login-err").textContent = m || "Please sign in again.";
}

/* ------------------------------------------------------------------ filter */
function isOpen(s) { return String(s.openClosed || "Open").toLowerCase().indexOf("close") === -1; }

function visible() {
  var q = $("q").value.trim().toLowerCase();
  var stage = $("f-stage").value;

  return state.styles.filter(function (s) {
    if (state.oc === "Open" && !isOpen(s)) return false;
    if (state.oc === "Closed" && isOpen(s)) return false;
    if (state.buyer && s.buyer !== state.buyer) return false;

    if (state.quick === "open" && !isOpen(s)) return false;
    if (state.quick === "closed" && isOpen(s)) return false;
    if (state.quick === "overdue" && !s.overdue) return false;
    if (state.quick === "ho" && !(s.milestones.ho && s.milestones.ho.status === "Approved")) return false;

    if (stage && s.nextKey !== stage) return false;

    if (q) {
      var hay = [s.poNo, s.styleNo, s.styleName, s.buyer, s.subtask, s.remarks].join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

["q", "f-stage"].forEach(function (id) {
  $(id).addEventListener("input", render);
  $(id).addEventListener("change", render);
});
$("refresh").addEventListener("click", function () {
  if (dirtyCount() && !confirm("You have unsaved changes on " + dirtyCount() +
      " card(s). Refreshing will discard them. Continue?")) return;
  load();
});
$("reset").addEventListener("click", function () {
  $("q").value = ""; $("f-stage").value = "";
  state.buyer = ""; state.quick = ""; state.oc = "";
  Array.prototype.forEach.call($("seg").children, function (b) {
    b.classList.toggle("on", b.getAttribute("data-oc") === "");
  });
  render();
});
Array.prototype.forEach.call($("seg").children, function (b) {
  b.addEventListener("click", function () {
    state.oc = b.getAttribute("data-oc");
    Array.prototype.forEach.call($("seg").children, function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    render();
  });
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "/" || $("app").classList.contains("hidden")) return;
  var t = e.target.tagName;
  if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
  e.preventDefault();
  $("q").focus();
});

function dirtyCount() { return Object.keys(state.edits).length; }

/* ------------------------------------------------------------------ render */
function statusClass(st) {
  return st === "Approved" ? "s-approved"
       : st === "In Progress" ? "s-progress"
       : st === "Rejected" ? "s-rejected"
       : st === "N/A" ? "s-na" : "";
}

function render() {
  // nextKey is derived here so the milestone filter and the card always agree.
  state.styles.forEach(function (s) {
    s.nextKey = "";
    for (var i = 0; i < state.milestones.length; i++) {
      var m = state.milestones[i], d = s.milestones[m.key];
      if (d && d.status !== "Approved" && d.status !== "N/A") { s.nextKey = m.key; break; }
    }
  });

  var rows = visible();
  state.rows = rows;
  renderStats();
  renderBuyers();

  $("count").textContent = rows.length === state.styles.length
    ? rows.length + " styles" : rows.length + " of " + state.styles.length;

  if (!rows.length) {
    $("content").innerHTML = '<div class="empty"><h3>Nothing to show</h3><p>' +
      (state.styles.length ? "No styles match these filters." : "No styles assigned to you yet.") + "</p></div>";
    return;
  }

  $("content").innerHTML = rows.map(cardHtml).join("");
  wireCards();
}

function cardHtml(s) {
  var h = hueOf(s.buyer);
  var d = daysFromToday(s.nextDue);
  var dueCls = s.nextDue ? (d < 0 ? "bad" : d <= 7 ? "prog" : "") : "";
  var pct = Math.round((s.approved / 13) * 100);

  var tiles = state.milestones.map(function (m, i) {
    var x = s.milestones[m.key] || {};
    var dueCell = x.hasDue
      ? '<input type="date" data-f="due" data-m="' + m.key + '" value="' + esc(x.due || "") + '">'
      : '<span class="none">n/a</span>';
    var apprCell = x.hasAppr
      ? '<input type="date" data-f="appr" data-m="' + m.key + '" value="' + esc(x.appr || "") + '">'
      : '<span class="none">n/a</span>';

    return '<div class="mt' + (x.late ? " late" : "") + '">' +
      '<div class="mh"><span class="mn">' + (i + 1) + '</span>' +
        '<span class="ml" title="' + esc(m.label) + '">' + esc(m.label) + "</span></div>" +
      '<button class="st ' + statusClass(x.status) + '" data-f="status" data-m="' + m.key +
        '" data-v="' + esc(x.status || "Pending") + '">' + esc(x.status || "Pending") + "</button>" +
      '<div class="mf"><b>Due</b>' + dueCell + "</div>" +
      '<div class="mf"><b>Appr</b>' + apprCell + "</div>" +
    "</div>";
  }).join("");

  return '<div class="card' + (isOpen(s) ? "" : " closed") + '" style="--h:' + h +
           '" data-po="' + esc(s.poNo) + '">' +
    '<div class="ctop">' +
      '<div class="cleft">' +
        '<div class="po">' + esc(s.poNo) + "</div>" +
        '<div class="sn">Style No ' + esc(s.styleNo || "—") + "</div>" +
        '<div class="nm">' + esc(s.styleName || "Unnamed style") + "</div>" +
        '<span class="buyer" data-buyer="' + esc(s.buyer || "") + '">' + esc(s.buyer || "No buyer") + "</span>" +
        '<div class="meta">' +
          '<span class="mini' + (pct === 100 ? " ok" : "") + '">' + s.approved + "/13</span>" +
          (s.nextDue ? '<span class="mini ' + dueCls + '">' + esc(nice(s.nextDue)) + "</span>" : "") +
          (s.overdue ? '<span class="mini bad">' + s.overdue + " late</span>" : "") +
          '<button class="lg" data-log="' + esc(s.poNo) + '">Log</button>' +
        "</div>" +
      "</div>" +
      '<div class="cms"><div class="strip">' + tiles + "</div></div>" +
    "</div>" +

    '<div class="cbot">' +
      '<div class="f"><label>Current task</label>' +
        '<input data-f="subtask" value="' + esc(s.subtask || "") + '" placeholder="e.g. PP to be sent"></div>' +
      '<div class="f"><label>Daily remarks</label>' +
        '<textarea data-f="remarks" rows="1" placeholder="Fitting feedback, delays, anything worth a note…">' +
        esc(s.remarks || "") + "</textarea></div>" +
      '<div class="go"><span class="unsaved">Unsaved</span>' +
        '<button class="btn btn-primary" data-submit="' + esc(s.poNo) + '">Submit</button></div>' +
    "</div>" +

    '<div class="logbox hidden" data-logbox="' + esc(s.poNo) + '">' +
      esc(s.log || "No entries yet.") + "</div>" +
  "</div>";
}

function find(po) {
  for (var i = 0; i < state.styles.length; i++) {
    if (String(state.styles[i].poNo) === String(po)) return state.styles[i];
  }
  return null;
}

function markDirty(card) {
  card.classList.add("dirty");
  state.edits[card.getAttribute("data-po")] = true;
}

function wireCards() {
  Array.prototype.forEach.call(document.querySelectorAll(".card"), function (card) {
    var po = card.getAttribute("data-po");
    if (state.edits[po]) card.classList.add("dirty");

    // Any edit marks the card, so "Unsaved" is honest rather than decorative.
    Array.prototype.forEach.call(card.querySelectorAll("input,textarea"), function (el) {
      el.addEventListener("input", function () { markDirty(card); });
      el.addEventListener("change", function () { markDirty(card); });
    });

    Array.prototype.forEach.call(card.querySelectorAll(".st"), function (btn) {
      btn.addEventListener("click", function (e) { e.stopPropagation(); openPop(btn, card); });
    });

    var buyerChip = card.querySelector(".buyer");
    if (buyerChip) buyerChip.addEventListener("click", function () {
      var b = buyerChip.getAttribute("data-buyer");
      if (!b) return;
      state.buyer = (state.buyer === b) ? "" : b;
      render();
    });

    var logBtn = card.querySelector("[data-log]");
    if (logBtn) logBtn.addEventListener("click", function () {
      var box = card.querySelector("[data-logbox]");
      box.classList.toggle("hidden");
      logBtn.textContent = box.classList.contains("hidden") ? "Log" : "Hide log";
    });

    var submit = card.querySelector("[data-submit]");
    if (submit) submit.addEventListener("click", function () { submitCard(card, submit); });

    var strip = card.querySelector(".strip");
    var cms = card.querySelector(".cms");
    var fades = function () {
      cms.classList.toggle("more-l", strip.scrollLeft > 4);
      cms.classList.toggle("more-r", strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 4);
    };
    strip.addEventListener("scroll", fades, { passive: true });
    fades();

    // Open the strip on the milestone that actually needs attention, rather
    // than always at New Enquiry — which is approved on almost every style.
    var s = find(po);
    if (s && s.nextKey) {
      var idx = 0;
      for (var i = 0; i < state.milestones.length; i++) {
        if (state.milestones[i].key === s.nextKey) { idx = i; break; }
      }
      if (idx > 1) { strip.scrollLeft = (idx - 1) * 154; fades(); }
    }
  });
  window.addEventListener("resize", function () {
    Array.prototype.forEach.call(document.querySelectorAll(".cms"), function (cms) {
      var strip = cms.querySelector(".strip");
      cms.classList.toggle("more-l", strip.scrollLeft > 4);
      cms.classList.toggle("more-r", strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 4);
    });
  });
}

/* ----------------------------------------------------------- status popover */
// A small menu rather than a button that cycles: with five statuses, cycling
// means overshooting and going round again, and on a tracker this wide that is
// how wrong statuses get saved.
var popFor = null;
function openPop(btn, card) {
  var pop = $("pop");
  popFor = { btn: btn, card: card };

  pop.innerHTML = state.statuses.map(function (st) {
    return '<button data-v="' + esc(st) + '"><span class="d"></span>' + esc(st) + "</button>";
  }).join("");

  var r = btn.getBoundingClientRect();
  pop.style.left = Math.min(r.left + window.scrollX, window.innerWidth - 150) + "px";
  pop.style.top = (r.bottom + window.scrollY + 4) + "px";
  pop.classList.add("open");

  Array.prototype.forEach.call(pop.querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () {
      var v = b.getAttribute("data-v");
      btn.textContent = v;
      btn.setAttribute("data-v", v);
      btn.className = "st " + statusClass(v);
      markDirty(card);
      closePop();
    });
  });
}
function closePop() { $("pop").classList.remove("open"); popFor = null; }
document.addEventListener("click", function (e) {
  if (popFor && !$("pop").contains(e.target)) closePop();
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePop(); });
window.addEventListener("scroll", closePop, { passive: true });

/* -------------------------------------------------------------------- save */
async function submitCard(card, btn) {
  var po = card.getAttribute("data-po");
  var s = find(po);
  if (!s) return;

  btn.disabled = true;
  btn.textContent = "Saving…";

  // Everything on the card is sent; the API compares against the sheet and
  // writes only what genuinely differs. The browser may be holding a stale
  // copy, so it is not the thing that should decide what counts as a change.
  var patch = {
    subtask: card.querySelector('[data-f="subtask"]').value,
    remarks: card.querySelector('[data-f="remarks"]').value,
    milestones: {}
  };

  Array.prototype.forEach.call(card.querySelectorAll("[data-m]"), function (el) {
    var k = el.getAttribute("data-m"), f = el.getAttribute("data-f");
    if (!patch.milestones[k]) patch.milestones[k] = {};
    patch.milestones[k][f] = (f === "status") ? el.getAttribute("data-v") : el.value;
  });

  try {
    var r = await api({ action: "save", token: state.token, poNo: po, patch: patch });
    if (!r.ok) throw new Error(r.error || "Could not save.");

    delete state.edits[po];
    card.classList.remove("dirty");

    if (!r.changed) { toast("PO " + po + " — nothing had changed."); }
    else { toast("PO " + po + " saved — " + r.changed + " change" + (r.changed === 1 ? "" : "s") + " logged."); }

    await load();
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = "Submit";
  }
}

// Closing the tab with unsaved work is almost always an accident.
window.addEventListener("beforeunload", function (e) {
  if (!dirtyCount()) return;
  e.preventDefault();
  e.returnValue = "";
});

/* ------------------------------------------------------------------- stats */
function renderStats() {
  var all = state.styles;
  var tiles = [
    { id: "", n: all.length, label: "Total styles" },
    { id: "open", n: all.filter(isOpen).length, label: "Open" },
    { id: "closed", n: all.filter(function (s) { return !isOpen(s); }).length, label: "Closed" },
    { id: "ho", n: all.filter(function (s) {
        return s.milestones.ho && s.milestones.ho.status === "Approved"; }).length,
      label: "H/O to prod", cls: "ok" },
    { id: "overdue", n: all.filter(function (s) { return s.overdue > 0; }).length,
      label: "Overdue", cls: "bad" }
  ];

  $("stats").innerHTML = tiles.map(function (t) {
    return '<div class="stat ' + (t.cls || "") + (state.quick === t.id ? " on" : "") +
      '" data-q="' + t.id + '"><span class="n">' + t.n + '</span><span class="l">' + t.label + "</span></div>";
  }).join("");

  Array.prototype.forEach.call(document.querySelectorAll(".stat"), function (el) {
    el.addEventListener("click", function () {
      var id = el.getAttribute("data-q");
      state.quick = (state.quick === id) ? "" : id;
      render();
    });
  });
}

function renderBuyers() {
  var counts = {};
  state.styles.forEach(function (s) {
    var b = String(s.buyer || "").trim();
    if (b) counts[b] = (counts[b] || 0) + 1;
  });
  var names = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); });

  // One buyer and nothing to choose between — the strip would be decoration.
  if (names.length < 2) { $("buyers").innerHTML = ""; return; }

  $("buyers").innerHTML =
    '<div class="pill all' + (state.buyer ? "" : " on") + '" data-b="">All buyers <span class="ct">' +
      state.styles.length + "</span></div>" +
    names.map(function (n) {
      return '<div class="pill' + (state.buyer === n ? " on" : "") + '" style="--h:' + hueOf(n) +
        '" data-b="' + esc(n) + '"><span class="sw"></span>' + esc(n) +
        ' <span class="ct">' + counts[n] + "</span></div>";
    }).join("");

  Array.prototype.forEach.call($("buyers").querySelectorAll(".pill"), function (el) {
    el.addEventListener("click", function () {
      var n = el.getAttribute("data-b");
      state.buyer = (state.buyer === n) ? "" : n;
      render();
    });
  });
}

/* ------------------------------------------------------------------- start */
if (API_URL.indexOf("PASTE_YOUR") === 0) {
  $("login-err").className = "msg msg-err";
  $("login-err").textContent = "Not connected yet — API_URL still needs the deployment URL.";
} else if (state.token) {
  enterApp();
}
</script>
</body>
</html>
